name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # manifest.jsonld is a generated artifact of manifest.ttl (via
      # bin/genJSON.js); catch anyone who hand-edited one without the
      # other, or forgot to regenerate before committing.
      #
      # negativeStructure is deliberately excluded: its manifest.ttl
      # already has a Cycle2ExtendsNegation entry that manifest.jsonld
      # doesn't -- regenerating would activate a real, currently-failing
      # test downstream (shex.js doesn't yet reject EXTENDS-cycle +
      # negation schemas). That's a parser/validator gap to fix in an
      # implementation, not something this check should paper over or
      # block CI on; re-include this dir once that's resolved.
      - name: manifest.jsonld matches manifest.ttl
        run: |
          for d in schemas validation negativeSyntax; do
            (cd "$d" && ../bin/genJSON.js manifest.ttl > manifest.jsonld)
          done
          git diff --exit-code -- 'schemas/manifest.jsonld' 'validation/manifest.jsonld' 'negativeSyntax/manifest.jsonld' || {
            echo "::error::manifest.jsonld is stale -- run '(cd DIR && ../bin/genJSON.js manifest.ttl > manifest.jsonld)' for the listed dir(s) and commit the result"
            exit 1
          }

      # Everything else is `npm test`, the same command a contributor runs
      # locally, so that CI and `npm t` cannot drift apart. Each check's
      # rationale is at the top of its script; in brief:
      #   test-shexj-jsg       schemas/*.json conform to doc/ShExJ.jsg
      #   test-shexj-types     schemas/*.json type-check against @types/shexj;
      #                        those listed as ahead of the types must fail
      #                        until a newer release is installed, then pass
      #                        (bin/checkShExJTypes.js)
      #   test-shexv-val/-err  validation/*.{val,err} conform to doc/ShExV.jsg
      #   test-schema-imports  every schemas/*.shex IMPORT target has its own
      #                        manifest entry (bin/checkSchemaImports.js)
      #   test-manifest-names  a test's id and its mf:name are the same string,
      #                        in every manifest dir, including the two the
      #                        regeneration check above leaves out
      #                        (bin/checkManifestNames.js)
      #   vocab-check          the published ShEx vocabulary defines every term
      #                        ShExR uses (vocab/mk_vocab.js)
      #   shexr-check          doc/ShExR.{json,ttl,ntriples} match doc/ShExR.shex
      #                        (bin/mkShExR.js)
      - run: npm test

      # informational only: flags schemas referenced by validation tests
      # (via EXTENDS, not IMPORT) that lack their own manifest entry.
      # Currently reports 3 pre-existing gaps that need real ShExR (.ttl)
      # content authored, not just a manifest entry -- not blocking CI
      # until that content exists.
      - name: schemas referenced by validation tests but not in schemas/manifest (informational)
        run: node missing.js
